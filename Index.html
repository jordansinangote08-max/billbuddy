<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BillBuddy</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}
    .app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
    .side{background:linear-gradient(180deg,#5b21b6,#2563eb);color:#fff;padding:26px 18px}
    .brand{font-size:26px;font-weight:700;margin-bottom:26px}
    .nav button{display:block;width:100%;border:0;background:transparent;color:#fff;text-align:left;padding:12px 14px;border-radius:10px;margin:5px 0;cursor:pointer}
    .nav button.active,.nav button:hover{background:rgba(255,255,255,.16)}
    main{padding:28px}
    .top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px}
    .top h1{margin:0}
    .sub{color:#697386;font-size:13px}
    .actions{display:flex;gap:8px;flex-wrap:wrap}
    .btn{border:0;border-radius:10px;padding:10px 14px;cursor:pointer;font-weight:600}
    .primary{background:#4f46e5;color:#fff}
    .muted{background:#e8ecf5}
    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
    .card{background:#fff;border-radius:16px;padding:18px;box-shadow:0 5px 18px rgba(26,36,63,.06)}
    .metric small{color:#697386}
    .metric strong{display:block;font-size:25px;margin-top:8px}
    .section{margin-top:24px}
    .section h2{font-size:19px}
    .bill-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
    .bill-head{display:flex;gap:12px;align-items:center}
    .bank-logo{width:46px;height:46px;border-radius:12px;background:#eef1f8;display:grid;place-items:center;font-weight:800}
    .money{font-size:23px;font-weight:700;margin:16px 0 6px}
    .due{font-size:14px}
    .pill{display:inline-block;padding:5px 9px;border-radius:999px;font-size:12px;background:#eef2ff;margin-top:10px}
    .empty{color:#7b8497;padding:18px 0}
    .table-wrap{overflow:auto}
    .tbl{width:100%;border-collapse:collapse;background:#fff;border-radius:14px;overflow:hidden}
    .tbl th,.tbl td{padding:12px;border-bottom:1px solid #edf0f5;text-align:left;font-size:14px}
    .tbl th{background:#fafbfe}
    .spinner{display:none}.spinner.on{display:inline}
    .ok{color:#15803d}
    @media(max-width:1000px){.grid,.bill-grid{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:700px){.app{display:block}.side{padding:16px}.brand{margin-bottom:12px}main{padding:18px}.grid,.bill-grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}
  </style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">💸 BillBuddy</div>
    <div class="nav">
      <button class="active">Upcoming Bills</button>
    </div>
  </aside>

  <main>
    <div class="top">
      <div>
        <h1>Upcoming Bills</h1>
        <div class="sub">Only processed bills due today or later. Duplicates are excluded.</div>
      </div>
      <div class="actions">
        <button class="btn muted" onclick="refreshData()">Refresh</button>
        <button class="btn primary" onclick="scanNow()">Scan Billz <span id="spin" class="spinner">…</span></button>
      </div>
    </div>

    <div class="grid">
      <div class="card metric">
        <small>Total Upcoming Amount</small>
        <strong id="mTotal">₱0.00</strong>
      </div>
      <div class="card metric">
        <small>Upcoming Bills</small>
        <strong id="mCount">0</strong>
      </div>
      <div class="card metric">
        <small>Next Due</small>
        <strong id="mNext">—</strong>
      </div>
    </div>

    <div class="section">
      <h2>Next Payments</h2>
      <div id="billCards" class="bill-grid"></div>
    </div>

    <div class="section">
      <h2>Upcoming Bill Details</h2>
      <div id="billsTable"></div>
    </div>
  </main>
</div>

<script>
let DATA={summary:{},bills:[]};

const peso=n=>'₱'+Number(n||0).toLocaleString('en-PH',{
  minimumFractionDigits:2,
  maximumFractionDigits:2
});

function parseDate(v){
  if(!v)return null;
  const d=new Date(v);
  return isNaN(d)?null:d;
}

function formatDate(v){
  const d=parseDate(v);
  return d?d.toLocaleDateString('en-PH',{
    year:'numeric',
    month:'short',
    day:'numeric'
  }):'—';
}

function esc(s){
  return String(s??'').replace(/[&<>"']/g,c=>({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;'
  }[c]));
}

function productName(v){
  return String(v||'Bill')
    .replaceAll('_',' ')
    .replace(/\b\w/g,c=>c.toUpperCase());
}

function daysUntil(v){
  const due=parseDate(v);
  if(!due)return null;

  const now=new Date();
  const today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const target=new Date(due.getFullYear(),due.getMonth(),due.getDate());

  return Math.round((target-today)/86400000);
}

function dueText(v){
  const n=daysUntil(v);
  if(n===null)return 'Due date unavailable';
  if(n===0)return 'Due today';
  if(n===1)return 'Due tomorrow';
  return `Due in ${n} days`;
}

function refreshData(){
  google.script.run
    .withSuccessHandler(render)
    .withFailureHandler(showErr)
    .getDashboardData();
}

function scanNow(){
  document.getElementById('spin').classList.add('on');

  google.script.run
    .withSuccessHandler(r=>{
      document.getElementById('spin').classList.remove('on');
      refreshData();

      alert(
        `Scan finished\n`+
        `Processed: ${r.processed||0}\n`+
        `Needs review: ${r.review||0}\n`+
        `Ignored: ${r.ignored||0}\n`+
        `Duplicates/existing skipped: ${r.skippedExisting||0}\n`+
        `Failed: ${r.failed||0}`
      );
    })
    .withFailureHandler(e=>{
      document.getElementById('spin').classList.remove('on');
      showErr(e);
    })
    .scanBillz();
}

function showErr(e){
  alert((e&&e.message)||e||'Something went wrong');
}

function render(d){
  DATA=d||{summary:{},bills:[]};

  const bills=(DATA.bills||[])
    .slice()
    .sort((a,b)=>new Date(a.due_date)-new Date(b.due_date));

  const summary=DATA.summary||{};

  document.getElementById('mTotal').textContent=
    peso(summary.totalAmountDue);

  document.getElementById('mCount').textContent=
    summary.upcomingBills ?? bills.length;

  document.getElementById('mNext').textContent=
    bills.length ? formatDate(bills[0].due_date) : '—';

  renderBillCards(bills);
  renderBillsTable(bills);
}

function renderBillCards(bills){
  const el=document.getElementById('billCards');

  if(!bills.length){
    el.innerHTML='<div class="card empty">No upcoming processed bills.</div>';
    return;
  }

  el.innerHTML=bills.map(b=>{
    const bank=b.bank_lender||'Unknown';
    return `
      <div class="card">
        <div class="bill-head">
          <div class="bank-logo">${esc(bank.slice(0,2).toUpperCase())}</div>
          <div>
            <b>${esc(bank)}</b>
            <div class="sub">${esc(productName(b.product_type))}</div>
          </div>
        </div>

        <div class="money">${peso(b.total_amount_due)}</div>
        <div class="due"><b>${formatDate(b.due_date)}</b></div>
        <div class="pill">${esc(dueText(b.due_date))}</div>
        <div class="sub" style="margin-top:10px">
          Statement: ${formatDate(b.statement_date)}
        </div>
      </div>
    `;
  }).join('');
}

function renderBillsTable(bills){
  const el=document.getElementById('billsTable');

  if(!bills.length){
    el.innerHTML='<div class="card empty">No upcoming bills.</div>';
    return;
  }

  el.innerHTML=`
    <div class="table-wrap">
      <table class="tbl">
        <thead>
          <tr>
            <th>Bank/Lender</th>
            <th>Product</th>
            <th>Amount Due</th>
            <th>Due Date</th>
            <th>Statement Date</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody>
          ${bills.map(b=>`
            <tr>
              <td>${esc(b.bank_lender||'')}</td>
              <td>${esc(productName(b.product_type))}</td>
              <td>${esc(peso(b.total_amount_due))}</td>
              <td>${esc(formatDate(b.due_date))}</td>
              <td>${esc(formatDate(b.statement_date))}</td>
              <td><span class="ok">Processed</span></td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>
  `;
}

refreshData();
</script>
</body>
</html>
