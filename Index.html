<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BillBuddy</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.side{background:linear-gradient(180deg,#5b21b6,#2563eb);color:#fff;padding:26px 18px}.brand{font-size:26px;font-weight:700;margin-bottom:26px}.nav button{display:block;width:100%;border:0;background:transparent;color:#fff;text-align:left;padding:12px 14px;border-radius:10px;margin:5px 0;cursor:pointer}.nav button.active,.nav button:hover{background:rgba(255,255,255,.16)}main{padding:28px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px}.top h1{margin:0}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:10px 14px;cursor:pointer;font-weight:600}.primary{background:#4f46e5;color:#fff}.muted{background:#e8ecf5}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:#fff;border-radius:16px;padding:18px;box-shadow:0 5px 18px rgba(26,36,63,.06)}.metric small{color:#697386}.metric strong{display:block;font-size:25px;margin-top:8px}.section{margin-top:24px}.section h2{font-size:19px}.account-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.account-head{display:flex;gap:12px;align-items:center}.bank-logo{width:46px;height:46px;border-radius:12px;background:#eef1f8;display:grid;place-items:center;font-weight:800}.sub{color:#697386;font-size:13px}.money{font-size:22px;font-weight:700;margin:14px 0 4px}.pill{display:inline-block;padding:5px 9px;border-radius:999px;font-size:12px;background:#eef2ff}.source{display:flex;justify-content:space-between;gap:14px;align-items:center;border-bottom:1px solid #edf0f5;padding:14px 0}.source:last-child{border:0}.source-actions{display:flex;gap:8px}.empty{color:#7b8497;padding:18px 0}.page{display:none}.page.active{display:block}.table-wrap{overflow:auto}.tbl{width:100%;border-collapse:collapse;background:white;border-radius:14px;overflow:hidden}.tbl th,.tbl td{padding:12px;border-bottom:1px solid #edf0f5;text-align:left;font-size:14px}.tbl th{background:#fafbfe}.status{font-size:12px;padding:4px 8px;border-radius:999px;background:#eef2ff}.notice{background:#fff7ed;border:1px solid #fed7aa;padding:12px 14px;border-radius:12px;margin-bottom:16px;color:#9a3412}.spinner{display:none}.spinner.on{display:inline}@media(max-width:1000px){.grid4{grid-template-columns:repeat(2,1fr)}.account-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:700px){.app{display:block}.side{padding:16px}.nav{display:flex;overflow:auto;gap:4px}.nav button{white-space:nowrap;width:auto}.brand{margin-bottom:12px}main{padding:18px}.grid4,.account-grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}
  </style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">💸 BillBuddy</div>
    <div class="nav">
      <button class="active" data-page="dashboard">Dashboard</button>
      <button data-page="accounts">Accounts</button>
      <button data-page="bills">Bills</button>
      <button data-page="sources">Tracking & Sources</button>
    </div>
  </aside>
  <main>
    <div class="top">
      <div><h1 id="title">Dashboard</h1><div class="sub">Email first. PDF only when needed.</div></div>
      <div class="actions"><button class="btn muted" onclick="refreshData()">Refresh</button><button class="btn primary" onclick="scanNow()">Scan Billz <span id="spin" class="spinner">…</span></button></div>
    </div>

    <section id="dashboard" class="page active">
      <div class="grid4">
        <div class="card metric"><small>Total Amount Due</small><strong id="mTotal">₱0.00</strong></div>
        <div class="card metric"><small>Accounts</small><strong id="mAccounts">0</strong></div>
        <div class="card metric"><small>Due Soon</small><strong id="mSoon">0</strong></div>
        <div class="card metric"><small>Overdue</small><strong id="mOverdue">0</strong></div>
      </div>
      <div class="section"><h2>Your Accounts</h2><div id="accountCards" class="account-grid"></div></div>
      <div class="section"><h2>Pending Sources</h2><div class="card" id="pendingQuick"></div></div>
    </section>

    <section id="accounts" class="page"><div class="card"><div id="accountsTable"></div></div></section>
    <section id="bills" class="page"><div class="card"><div id="billsTable"></div></div></section>
    <section id="sources" class="page">
      <div class="notice">New senders are Pending by default. Choose Track or Ignore. Existing bill history is never deleted when a source is excluded.</div>
      <div class="section"><h2>Pending</h2><div class="card" id="pendingSources"></div></div>
      <div class="section"><h2>Tracked</h2><div class="card" id="includedSources"></div></div>
      <div class="section"><h2>Excluded</h2><div class="card" id="excludedSources"></div></div>
    </section>
  </main>
</div>
<script>
let DATA={summary:{},accounts:[],bills:[],sources:{pending:[],included:[],excluded:[]}};
const peso=n=>'₱'+Number(n||0).toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2});
const date=v=>{if(!v)return '—';const d=new Date(v);return isNaN(d)?String(v):d.toLocaleDateString('en-PH',{year:'numeric',month:'short',day:'numeric'})};
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function refreshData(){google.script.run.withSuccessHandler(render).withFailureHandler(showErr).getDashboardData()}
function scanNow(){document.getElementById('spin').classList.add('on');google.script.run.withSuccessHandler(r=>{document.getElementById('spin').classList.remove('on');refreshData();alert(`Scan finished\nProcessed: ${r.processed}\nPending: ${r.pending}\nExcluded: ${r.excluded}\nNeeds review: ${r.review}\nFailed: ${r.failed}`)}).withFailureHandler(e=>{document.getElementById('spin').classList.remove('on');showErr(e)}).scanBillz()}
function showErr(e){alert((e&&e.message)||e||'Something went wrong')}
function render(d){DATA=d||DATA;const s=DATA.summary||{};mTotal.textContent=peso(s.totalAmountDue);mAccounts.textContent=s.accounts||0;mSoon.textContent=s.dueSoon||0;mOverdue.textContent=s.overdue||0;renderAccounts();renderBills();renderSources()}
function renderAccounts(){const arr=DATA.accounts||[];accountCards.innerHTML=arr.length?arr.map(a=>`<div class="card"><div class="account-head"><div class="bank-logo">${esc((a.bank_lender||'?').slice(0,2).toUpperCase())}</div><div><b>${esc(a.bank_lender)}</b><div class="sub">${esc((a.product_type||'').replaceAll('_',' '))}</div></div></div><div class="money">${peso(latestAmount(a.account_key))}</div><div class="sub">Due ${date(latestDue(a.account_key))}</div></div>`).join(''):'<div class="empty">No tracked accounts yet.</div>';
accountsTable.innerHTML=table(['Bank/Lender','Product','Display Name','Status'],arr.map(a=>[a.bank_lender,a.product_type,a.display_name,a.tracking_status]));}
function latestBill(key){return (DATA.bills||[]).filter(b=>String(b.account_key)===String(key)).sort((a,b)=>new Date(b.processed_at)-new Date(a.processed_at))[0]||{}}
function latestAmount(key){return latestBill(key).total_amount_due||0}function latestDue(key){return latestBill(key).due_date||''}
function renderBills(){const arr=DATA.bills||[];billsTable.innerHTML=table(['Bank/Lender','Product','Total Amount Due','Due Date','Statement Date','Status'],arr.map(b=>[b.bank_lender,b.product_type,peso(b.total_amount_due),date(b.due_date),date(b.statement_date),b.processing_status]));}
function renderSources(){const sets=DATA.sources||{};pendingQuick.innerHTML=sourceList(sets.pending||[],true);pendingSources.innerHTML=sourceList(sets.pending||[],true);includedSources.innerHTML=sourceList(sets.included||[],false);excludedSources.innerHTML=sourceList(sets.excluded||[],false);}
function sourceList(arr,pending){if(!arr.length)return '<div class="empty">None.</div>';return arr.map(s=>`<div class="source"><div><b>${esc(s.source_name||s.bank_lender||s.sender_email)}</b><div class="sub">${esc(s.sender_email)} · ${esc((s.product_type||'').replaceAll('_',' '))}</div></div><div class="source-actions">${s.tracking_status!=='included'?`<button class="btn primary" onclick="setStatus('${esc(s.source_key)}','included')">Track</button>`:''}${s.tracking_status!=='excluded'?`<button class="btn muted" onclick="setStatus('${esc(s.source_key)}','excluded')">Ignore</button>`:''}</div></div>`).join('')}
function setStatus(k,s){google.script.run.withSuccessHandler(render).withFailureHandler(showErr).setSourceStatus(k,s,'Changed from dashboard')}
function table(h,rows){if(!rows.length)return '<div class="empty">No records yet.</div>';return `<div class="table-wrap"><table class="tbl"><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(x=>`<td>${esc(x)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById(b.dataset.page).classList.add('active');title.textContent=b.textContent}));
refreshData();
</script>
</body>
</html>
