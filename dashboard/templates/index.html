<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BillBuddy</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div>
        <div class="eyebrow">BILLBUDDY</div>
        <h1 id="pageTitle">Upcoming payments</h1>
        <p class="subtitle" id="pageSubtitle">Your next bills, sorted by due date.</p>
      </div>
      <button id="refreshButton" class="button" type="button">Refresh</button>
    </header>

    <nav class="tabs">
      <button class="tab active" data-page="payments">Payments</button>
      <button class="tab" data-page="limits">Credit Limits</button>
    </nav>

    <main>
      <section id="paymentsPage" class="page active">
        <section class="summary-grid">
          <article class="summary-card featured">
            <span>Upcoming total</span>
            <strong id="totalAmount">₱0.00</strong>
            <small id="totalCaption">Loading…</small>
          </article>
          <article class="summary-card">
            <span>Upcoming bills</span>
            <strong id="billCount">0</strong>
            <small>Processed & unique</small>
          </article>
          <article class="summary-card">
            <span>Next due</span>
            <strong id="nextDue">—</strong>
            <small id="nextDueCaption">No due date yet</small>
          </article>
        </section>

        <section class="section">
          <div class="section-heading">
            <div>
              <div class="section-kicker">PAYMENTS</div>
              <h2>What’s coming up</h2>
            </div>
            <span id="lastUpdated"></span>
          </div>
          <div id="statusBox" class="status-box hidden"></div>
          <div id="billGrid" class="bill-grid"></div>
        </section>
      </section>

      <section id="limitsPage" class="page">
        <section class="section limits-section">
          <div class="section-heading">
            <div>
              <div class="section-kicker">CREDIT CARDS</div>
              <h2>Credit limits</h2>
              <p class="section-note">Set each card’s limit. BillBuddy uses a 20% utilization target by default.</p>
            </div>
          </div>
          <div id="limitsStatus" class="status-box hidden"></div>
          <div id="creditLimitGrid" class="limit-grid"></div>
        </section>
      </section>
    </main>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
